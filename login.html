<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Pulse</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<canvas id="pulse-network"></canvas>

<main class="auth-container">


<div class="auth-card">


<img 
src="pulse_logo.png"
class="auth-logo"
>


<h1>
Welcome back
</h1>


<p>
Sign in to continue.
</p>



<form>


<input
id="email"
type="email"
placeholder="Email"
required
>



<input
id="password"
type="password"
placeholder="Password"
required
>



<button 
class="primary"
type="submit"
>

Login

</button>


</form>



<p class="auth-switch">

Don't have an account?

<a href="signup">
Create one
</a>

</p>



<a href="index" class="back-home">

← Back to Pulse

</a>


</div>


</main>




<script src="network.js"></script>

<script type="module" src="login.js"></script>


</body>

</html>
