<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pulse</title>

<link rel="stylesheet" href="style.css?v=2">

</head>


<body>


<canvas id="pulse-network"></canvas>



<header class="app-header">


<div class="app-title">

Pulse

</div>



<a href="account" class="profile">


<div 
class="profile-circle"
id="profileInitial"
>

?

</div>


<span id="profileName">

Loading...

</span>


</a>


</header>





<main class="app-container">



<aside class="sidebar">


<button 
class="app-option active"
data-page="global"
>

Global Chat

</button>



<button 
class="app-option"
data-page="messages"
>

Messages

</button>



<button 
class="app-option"
data-page="friends"
>

Friends

</button>


</aside>






<section class="app-content">




    <section id="global-page">


        <h1>
        Global Chat
        </h1>



        <div 
        id="chatMessages"
        class="chat-messages"
        >

        </div>



        <div class="chat-input">


        <input
        id="messageInput"
        placeholder="Message everyone..."
        maxlength="300"
        >



        <button 
        id="sendMessage"
        class="primary"
        >

        Send

        </button>


        </div>



        </section>

   <section 
id="friends-page"
class="hidden-page friends-page"
>


    <div class="friends-header">

        <h1>
            Friends
        </h1>

        <p>
            Connect with people on Pulse.
        </p>

    </div>



    <div class="friend-search">

        <input
        id="friendSearch"
        placeholder="Search people..."
        >

    </div>




    <div class="friends-section">


        <h2>
            Search Results
        </h2>


        <div id="searchResults">

        </div>


    </div>





    <div class="friends-section">


        <h2>
            Friend Requests
        </h2>


        <div id="incomingRequests">

        </div>


    </div>





    <div class="friends-section">


        <h2>
            My Friends
        </h2>


        <div id="friendsList">

        </div>


    </div>



</section>



<section 
id="messages-page"
class="hidden-page"
>


    <h1>
        Messages
    </h1>


    <p>
        Your direct messages will appear here.
    </p>


</section>



</section>



</main>


<div 
id="profileModal"
class="profile-modal hidden-page"
>


<div class="profile-card">


<button 
id="closeProfile"
class="close-profile"
>
×
</button>


<div 
id="profilePicture"
class="profile-large-picture"
>
</div>


<h2 id="viewProfileName">
Name
</h2>


<p id="viewProfileUsername">
@username
</p>


<p id="viewProfileBio">
Bio
</p>


<button 
id="profileAction"
>
Add Friend
</button>


</div>


</div>





<script src="network.js"></script>

<script type="module" src="app.js"></script>

<script type="module" src="chat.js"></script>

<script type="module" src="friends.js"></script>

<script type="module" src="profile.js"></script>

</body>

</html>
