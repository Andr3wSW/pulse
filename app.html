<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pulse</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<canvas id="pulse-network"></canvas>



<header class="app-header">


<div class="nav-logo">

<img src="pulse_logo.png">

<span>Pulse</span>

</div>



<div class="profile">

<div 
class="profile-circle"
id="profileInitial"
>
?
</div>


<span id="profileName">
Loading...
</span>

</div>

</header>




<main class="app-container">


<aside class="sidebar">


<button class="app-option active">

Global Chat

</button>


<button class="app-option">

Messages

</button>


<button class="app-option">

Friends

</button>


</aside>




<section class="app-content">


<div class="welcome-card">


<h1>
Welcome to Pulse
</h1>


<p>
Your conversations will appear here.
</p>


</div>


</section>


</main>





<script src="network.js"></script>

<script type="module" src="app.js"></script>

</body>

</html>
