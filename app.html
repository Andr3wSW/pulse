<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pulse</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<canvas id="pulse-network"></canvas>



<header class="app-header">


<div class="app-title">

Pulse

</div>



<a href="account" class="profile">


<div 
class="profile-circle"
id="profileInitial"
>

?

</div>


<span id="profileName">

Loading...

</span>


</a>


</header>





<main class="app-container">



<aside class="sidebar">


<button 
class="app-option active"
data-page="global"
>

Global Chat

</button>



<button 
class="app-option"
data-page="messages"
>

Messages

</button>



<button 
class="app-option"
data-page="friends"
>

Friends

</button>


</aside>






<section class="app-content">




    <div id="app-content-area">


        <div class="welcome-card">


            <h1>
                Welcome to Pulse
            </h1>


            <p>
                Select an option to begin.
            </p>


        </div>


    </div>

    <section 
    id="friends-page"
    class="hidden-page"
    >


    <h1>
    Friends
    </h1>



    <div class="friend-search">


    <input
    id="friendSearch"
    placeholder="Search by name or username..."
    >


    <button 
    id="searchUsers"
    class="primary"
    >

    Search

    </button>


    </div>



    <div id="searchResults">

    </div>




    <h2>
    Incoming Requests
    </h2>



    <div id="incomingRequests">

    </div>



    </section>



</section>



</main>





<script src="network.js"></script>

<script type="module" src="app.js"></script>


</body>

</html>
