<canvas id="pulse-network"></canvas>


<main class="account-container">


<div class="account-card">


<div class="large-profile">

<img 
id="profileImage"
src="pulse_logo.png"
>


</div>


<h1 id="displayName">
Loading...
</h1>


<p id="username">
Loading...
</p>



<div class="settings-section">

<h2>
Username
</h2>


<input 
id="usernameInput"
placeholder="New username"
>


<button id="changeUsername">
Change Username
</button>


<p id="usernameTimer"></p>

</div>




<div class="settings-section">

<h2>
Profile Picture
</h2>


<input 
type="file"
id="imageUpload"
accept="image/*"
>


</div>




<div class="settings-section">

<h2>
Bio
</h2>


<textarea 
id="bioInput"
placeholder="Tell people about yourself..."
></textarea>


<button id="saveBio">
Save
</button>


</div>




<button 
id="logout"
class="logout-btn"
>
Logout
</button>



</div>

</main>
