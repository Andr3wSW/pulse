<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account | Pulse</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<canvas id="pulse-network"></canvas>



<header class="app-header">


<div class="app-title">

Pulse

</div>


<a href="app" class="back-home">

← Back to Pulse

</a>


</header>





<main class="account-container">



<div class="account-card">



<div class="large-profile">


<img 
id="profileImage"
src="pulse_logo.png"
>


</div>




<input
type="file"
id="imageUpload"
accept="image/*"
>




<h1 id="displayName">

Loading...

</h1>


<p id="username">

@username

</p>





<div class="account-section">


<h2>
About Me
</h2>


<textarea
id="bioInput"
placeholder="Tell people about yourself..."
maxlength="200"
></textarea>



<button 
id="saveBio"
class="primary"
>

Save Bio

</button>


</div>





<div class="account-section">


<h2>
Account Information
</h2>



<div class="info-row">

<span>
Email
</span>

<span id="email">

Loading...

</span>

</div>



<div class="info-row">

<span>
Joined
</span>

<span id="createdAt">

Loading...

</span>

</div>



</div>






<button 
id="logout"
class="logout-btn"
>

Logout

</button>



</div>



</main>





<script src="network.js"></script>

<script type="module" src="account.js"></script>


</body>

</html>
