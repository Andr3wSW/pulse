<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Signup | Pulse</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<canvas id="pulse-network"></canvas>



<nav class="navbar">

<div class="nav-logo">

<img src="pulse_logo.png">

<span>Pulse</span>

</div>


<div class="nav-buttons">

<a href="index" class="secondary">
Home
</a>

</div>

</nav>




<main class="auth-container">


<div class="auth-card">


<img 
src="pulse_logo.png"
class="auth-logo"
>


<h1>
Create your account
</h1>


<p>
Join the conversation.
</p>



<form>


<input 
type="text"
placeholder="Username"
>


<input 
type="email"
placeholder="Email"
>


<input 
type="password"
placeholder="Password"
>



<button class="primary">

Create Account

</button>


</form>



<p class="auth-switch">

Already have an account?

<a href="login">
Login
</a>

</p>


</div>


</main>



<script src="network.js"></script>


</body>

</html>
