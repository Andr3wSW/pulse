<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Signup | Pulse</title>
<link rel="icon" href="pulse_logo.png" sizes="64x64">
<link rel="apple-touch-icon" href="pulse_logo.png">

<link rel="stylesheet" href="style.css">

</head>


<body>


<canvas id="pulse-network"></canvas>

<main class="auth-container">


<div class="auth-card">


<img 
src="pulse_logo.png"
class="auth-logo"
>


<h1>
Create your account
</h1>


<p>
Join the conversation.
</p>



<form>

<input 
id="firstName"
type="text"
placeholder="First Name (Required)"
required
>

<input 
id="lastName"
type="text"
placeholder="Last Name (Optional)"
>

<input 
id="username"
type="text"
placeholder="Username"
required
>


<input 
id="email"
type="email"
placeholder="Email"
required
>


<input 
id="password"
type="password"
placeholder="Password"
required
>



<button class="primary">

Create Account

</button>


</form>



<p class="auth-switch">

Already have an account?

<a href="login">
Login
</a>

</p>


</div>


</main>

<script type="module" src="signup.js"></script>
<script src="network.js"></script>


</body>

</html>
